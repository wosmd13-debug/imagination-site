<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추억보관소 · 그 시절, 그 골목</title>
<meta name="description" content="당신의 선택이 그 시절의 골목으로 이어지는 향수 어린 이야기">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌇</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6f96"/>
      <stop offset="45%" stop-color="#e0834a"/>
      <stop offset="100%" stop-color="#2a1710"/>
    </linearGradient>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcdcf0"/>
      <stop offset="100%" stop-color="#f3e6c8"/>
    </linearGradient>
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a28"/>
      <stop offset="100%" stop-color="#4a2e1c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="60%" stop-color="#f0a63f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0a63f" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<header class="site-header">
  <div class="logo">추억보관소</div>
</header>

<main>

  <section id="stories" class="stories">
    <h2 class="section-title">그 시절, 그 골목</h2>
    <p class="section-desc">당신의 선택이 그리운 그날로 이어집니다.</p>

    <div class="adventure">
      <div class="adventure-stage" id="adventure-stage">
        <div class="adventure-art" id="adventure-art" aria-hidden="true"></div>
        <p class="adventure-text" id="adventure-text"></p>
        <div class="adventure-choices" id="adventure-choices"></div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>추억보관소 · 그리움은 계절 없이 찾아옵니다</p>
</footer>

<script src="script.js"></script>
</body>
</html>
