<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>야근 사무실 · 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<main class="game">
  <canvas id="scene" width="240" height="135" aria-label="불이 하나만 켜진 야근 사무실. 반짝이는 물건을 눌러보세요."></canvas>

  <div class="dialogue" id="dialogue">
    <div class="speaker" id="speaker" hidden></div>
    <p class="dline" id="dline"></p>
    <span class="dnext" id="dnext">▼</span>
  </div>

  <div class="choices" id="choices"></div>
</main>

<script src="game.js"></script>
</body>
</html>
